name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: [self-hosted, linux, ARM64, subscription-api-ci]
    timeout-minutes: 15
    steps:
      - name: Verify disposable worker
        run: |
          test "$(id -u)" = 2000
          test ! -e /home/ci/previous-job
          test -z "$(findmnt -rn -t virtiofs,9p,fuse.sshfs)"
          if sudo -n true 2>/dev/null; then
            echo "Worker must not have sudo access"
            exit 1
          fi
          touch /home/ci/previous-job
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Test runner supervisor
        run: python3 -m unittest discover -s infra/ci-runner -p 'test_*.py'
